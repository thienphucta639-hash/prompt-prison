<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhà Tù Prompt</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#08080c;--s1:#101016;--s2:#18181f;--s3:#222230;
            --bd:#1e1e2e;--bd2:#2a2a3d;
            --tx:#d4d4e0;--tx2:#7c7c9a;--tx3:#4a4a62;
            --ac:#635bff;--ac2:#8b83ff;--ac3:#a78bfa;
            --gn:#10b981;--rd:#ef4444;--yw:#f59e0b;
            --g1:linear-gradient(135deg,#635bff,#a78bfa);
            --r:8px;--tr:all .2s ease
        }
        html{font-size:15px}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;line-height:1.5;overflow:hidden}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
        button,select,input,textarea{font-family:inherit}
        ::selection{background:rgba(99,91,255,.3)}
        .header{position:sticky;top:0;z-index:100;background:rgba(16,16,22,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:48px}
        .h-left{display:flex;align-items:center;gap:10px}
        .logo{font-size:1rem;font-weight:600;color:var(--tx)}.logo em{font-style:normal;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .h-right{display:flex;gap:6px}
        .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--s2);color:var(--tx2);font-size:.8rem;cursor:pointer;transition:var(--tr);white-space:nowrap;user-select:none;line-height:1.4}
        .btn:hover{color:var(--tx);background:var(--s3);transform:translateY(-1px)}.btn:active{transform:translateY(0) scale(.98)}
        .btn-p{background:var(--ac);border-color:transparent;color:#fff}.btn-p:hover{background:var(--ac2);box-shadow:0 4px 16px rgba(99,91,255,.25)}
        .btn-d{color:var(--rd);border-color:rgba(239,68,68,.2)}.btn-d:hover{background:rgba(239,68,68,.08)}
        .btn-s{padding:3px 8px;font-size:.75rem}
        .btn-w{color:var(--gn);border-color:rgba(16,185,129,.2)}.btn-w:hover{background:rgba(16,185,129,.08)}
        .layout{display:flex;height:calc(100vh - 48px);height:calc(100dvh - 48px)}
        .sb{width:240px;min-width:240px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
        .sb-sec{padding:10px 10px 6px}
        .sb-t{font-size:.65rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin-bottom:4px;padding:0 6px;font-weight:600}
        .sb-search input{width:100%;padding:7px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;outline:none;transition:var(--tr)}
        .sb-search input::placeholder{color:var(--tx3)}.sb-search input:focus{border-color:var(--ac)}
        .seg{display:flex;gap:2px;padding:4px 10px;margin-bottom:2px}
        .seg-b{flex:1;padding:4px 0;border:none;border-radius:6px;background:transparent;color:var(--tx3);font-size:.72rem;cursor:pointer;text-align:center;transition:var(--tr);font-weight:500}.seg-b:hover{color:var(--tx2)}.seg-b.on{background:var(--s3);color:var(--tx)}
        .ai-sec{padding:4px 10px 8px;border-bottom:1px solid var(--bd)}
        .ai-list{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
        .ai-tag{padding:2px 7px;border:1px solid var(--bd);border-radius:5px;font-size:.68rem;cursor:pointer;transition:var(--tr);color:var(--tx3);font-weight:500}.ai-tag:hover{border-color:var(--bd2);color:var(--tx2)}.ai-tag.on{background:var(--ac);border-color:var(--ac);color:#fff}
        .ai-tag .x{margin-left:3px;opacity:.5;cursor:pointer;font-size:.6rem}.ai-tag .x:hover{opacity:1}
        .ai-add-row{display:flex;gap:3px;margin-top:5px}
        .ai-inp{flex:1;padding:3px 7px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;color:var(--tx);font-size:.7rem;outline:none}.ai-inp:focus{border-color:var(--ac)}
        .ai-abtn{padding:3px 7px;border:1px solid var(--bd);border-radius:5px;background:var(--s2);color:var(--tx2);font-size:.7rem;cursor:pointer;transition:var(--tr)}.ai-abtn:hover{background:var(--ac);color:#fff}
        .cat-list{flex:1;overflow-y:auto;padding:4px 6px 6px}
        .cat-i{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.82rem;transition:background .15s,color .15s,box-shadow .15s;user-select:none;color:var(--tx2)}
        .cat-i:hover{background:var(--s2);color:var(--tx)}.cat-i.on{background:rgba(99,91,255,.08);color:var(--ac2)}
        .cat-i.drag-over{box-shadow:0 -2px 0 0 var(--ac) inset}.cat-i.drag-over-below{box-shadow:0 2px 0 0 var(--ac) inset}.cat-i.dragging{opacity:.4}
        .cat-grip{cursor:grab;color:var(--tx3);font-size:.7rem;padding:2px;display:flex;align-items:center;flex-shrink:0;opacity:0;transition:opacity .15s}.cat-i:hover .cat-grip{opacity:1}
        .cat-d{width:6px;height:6px;border-radius:2px;flex-shrink:0;transition:transform .2s}.cat-i:hover .cat-d{transform:scale(1.4)}
        .cat-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cat-c{font-size:.68rem;color:var(--tx3);min-width:16px;text-align:right}.cat-i.on .cat-c{color:var(--ac)}
        .cat-a{display:flex;gap:1px;opacity:0;transition:opacity .15s;flex-shrink:0}.cat-i:hover .cat-a{opacity:1}
        .cat-ab{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px 3px;font-size:.65rem;border-radius:3px;transition:var(--tr)}.cat-ab:hover{color:var(--tx);background:var(--s3)}
        .drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:var(--s2);border:1px solid var(--ac);border-radius:6px;padding:6px 10px;font-size:.82rem;color:var(--ac2);box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:.9;max-width:200px}
        .stats{padding:6px 12px;border-top:1px solid var(--bd);font-size:.65rem;color:var(--tx3);display:flex;gap:10px}
        .trash-fab{position:fixed;bottom:20px;right:20px;z-index:90;width:44px;height:44px;border-radius:50%;background:var(--s2);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--tr);font-size:1.1rem;box-shadow:0 4px 16px rgba(0,0,0,.3)}
        .trash-fab:hover{transform:scale(1.1);border-color:var(--rd)}
        .trash-fab .tc{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-size:.58rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 4px}.trash-fab .tc.hide{display:none}
        .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
        .tb{padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:40px;border-bottom:1px solid var(--bd);background:var(--s1);gap:8px}
        .tb-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
        .tb-cat{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
        .tb-cnt{font-size:.7rem;color:var(--tx3)}
        .tb-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
        .tb-sort{padding:4px 8px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx2);font-size:.75rem;outline:none;cursor:pointer}
        .section-div{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 0 4px}
        .section-line{flex:1;height:1px;background:var(--bd2)}
        .section-name{font-size:.78rem;font-weight:600;color:var(--ac2);white-space:nowrap}
        .grid{flex:1;overflow-y:auto;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;align-content:start}
        .card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:var(--tr);position:relative}
        .card::after{content:'';position:absolute;inset:-1px;border-radius:10px;background:var(--g1);opacity:0;transition:opacity .3s;z-index:-1}
        .card:hover{border-color:transparent;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}.card:hover::after{opacity:.15}
        .card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
        .card-t{font-size:.88rem;font-weight:600;line-height:1.35;flex:1;word-break:break-word;color:var(--tx)}
        .tags{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}
        .tag{font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:500;text-transform:uppercase}
        .tag-pc{background:rgba(99,91,255,.1);color:var(--ac2)}.tag-ph{background:rgba(16,185,129,.1);color:var(--gn)}.tag-bt{background:rgba(167,139,250,.1);color:var(--ac3)}.tag-ai{background:rgba(244,114,182,.1);color:#f472b6}.tag-sec{background:rgba(99,91,255,.08);color:var(--ac3);font-size:.58rem}
        .card-p{font-size:.78rem;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
        .card-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .card-tag{font-size:.65rem;padding:1px 6px;border-radius:3px;color:var(--tx3)}
        .card-dt{font-size:.65rem;color:var(--tx3);margin-left:auto}
        .card-act{display:flex;gap:3px;padding-top:8px;border-top:1px solid var(--bd)}
        .card-act .btn{flex:1;justify-content:center}
        .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px;padding:40px 20px;text-align:center;grid-column:1/-1;min-height:200px}
        .empty-tx{font-size:.88rem;color:var(--tx2)}.empty-sub{font-size:.78rem}

        .mo{display:none;position:fixed;inset:0;background:rgba(4,4,8,.75);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:16px}.mo.show{display:flex}
        .mo-box{background:var(--s1);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:580px;max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden;animation:moIn .2s ease;box-shadow:0 24px 64px rgba(0,0,0,.5)}
        @keyframes moIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .mo-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
        .mo-t{font-size:.92rem;font-weight:600;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .mo-x{background:none;border:none;color:var(--tx3);font-size:1.1rem;cursor:pointer;padding:4px 6px;border-radius:4px;line-height:1;transition:var(--tr)}.mo-x:hover{color:var(--tx);background:var(--s2);transform:rotate(90deg)}
        .mo-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .mo-f{padding:10px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:6px}
        .fg{display:flex;flex-direction:column;gap:4px}
        .fl{font-size:.75rem;font-weight:500;color:var(--tx2)}.fl .req{color:var(--rd)}
        .fi{padding:7px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.84rem;outline:none;transition:var(--tr)}.fi:focus{border-color:var(--ac)}
        .ft{padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;outline:none;resize:vertical;min-height:130px;font-family:'JetBrains Mono','Consolas',monospace;line-height:1.65;transition:var(--tr)}.ft:focus{border-color:var(--ac)}
        .ft-note{min-height:60px;font-family:inherit;font-size:.84rem;color:#c8c8e0;line-height:1.6}
        .fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
        .color-row{display:flex;align-items:center;gap:8px}
        .color-prev{width:32px;height:32px;border-radius:6px;border:2px solid var(--bd2)}
        .fi-color{flex:1;padding:3px;height:36px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;cursor:pointer}
        .fi-color::-webkit-color-swatch-wrapper{padding:2px}.fi-color::-webkit-color-swatch{border:none;border-radius:4px}

        /* WORKSPACE */
        .ws-box{max-width:960px;max-height:94vh;max-height:94dvh}
        .ws-layout{display:flex;gap:0;flex:1;overflow:hidden}
        .ws-left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--bd);overflow:hidden}
        .ws-right{width:360px;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
        .ws-ptitle{font-size:.68rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;padding:8px 14px 4px}
        .ws-content-wrap{flex:1;overflow-y:auto;padding:0 14px 10px}
        .ws-content-view{font-family:'JetBrains Mono','Consolas',monospace;font-size:.8rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--tx);padding:8px;cursor:pointer;border-radius:var(--r);transition:background .15s}
        .ws-content-view:hover{background:rgba(99,91,255,.04)}
        .ws-content-view mark{background:rgba(245,158,11,.2);color:var(--yw);border-radius:2px;padding:0 2px}
        .ws-click-hint{font-size:.65rem;color:var(--tx3);padding:0 14px 6px;font-style:italic}
        .ws-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--bd);font-size:.72rem}
        .ws-note-wrap{border-top:1px solid var(--bd);display:flex;flex-direction:column;max-height:35%}
        .ws-note-head{padding:6px 14px}.ws-note-label{font-size:.68rem;font-weight:600;color:var(--ac2);text-transform:uppercase;letter-spacing:.5px}
        .ws-note-body{flex:1;overflow-y:auto;padding:0 14px 10px}
        .ws-note-text{font-size:.82rem;color:#b8b8d0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
        .ws-fields{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
        .ws-field{display:flex;flex-direction:column;gap:3px}
        .ws-field-label{font-size:.72rem;color:var(--ac2);font-weight:500}
        .ws-field-input{padding:6px 10px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);font-size:.82rem;outline:none;transition:var(--tr)}.ws-field-input:focus{border-color:var(--yw)}
        .ws-no-vars{padding:20px;text-align:center;color:var(--tx3);font-size:.82rem}
        .ws-scratch{padding:10px 14px;border-top:1px solid var(--bd);flex-shrink:0;display:flex;flex-direction:column;flex:1;min-height:0}
        .ws-scratch-label{font-size:.68rem;font-weight:600;color:var(--yw);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;flex-shrink:0}
        .ws-scratch-area{width:100%;padding:10px 12px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;color:#c8c8e0;font-size:.84rem;outline:none;resize:none;flex:1;min-height:150px;line-height:1.6;font-family:inherit;transition:var(--tr)}.ws-scratch-area:focus{border-color:var(--yw)}
        .ws-scratch-area::placeholder{color:var(--tx3)}

        /* Content editor modal */
        .ce-box{max-width:800px;max-height:90vh;max-height:90dvh}
        .ce-area{width:100%;min-height:300px;padding:12px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.84rem;font-family:'JetBrains Mono','Consolas',monospace;line-height:1.7;outline:none;resize:vertical}.ce-area:focus{border-color:var(--ac)}

        .cc{text-align:center;padding:16px 0}.cc p{font-size:.84rem;color:var(--tx2);margin-top:6px}
        .toast-c{position:fixed;top:56px;right:16px;z-index:300;display:flex;flex-direction:column;gap:4px;pointer-events:none}
        .toast{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:.8rem;display:flex;align-items:center;gap:6px;animation:tIn .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:auto;color:var(--tx2)}
        .toast.ok{border-left:2px solid var(--gn);color:var(--gn)}.toast.err{border-left:2px solid var(--rd);color:var(--rd)}.toast.inf{border-left:2px solid var(--ac);color:var(--ac2)}
        @keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}.toast.out{opacity:0;transform:translateX(20px);transition:all .2s}
        .menu-t{display:none;background:none;border:none;color:var(--tx);font-size:1.1rem;cursor:pointer;padding:4px 8px}
        .sb-ov{display:none;position:fixed;inset:0;background:rgba(4,4,8,.6);z-index:49}.sb-ov.show{display:block}
        .sec-list{display:flex;flex-direction:column;gap:4px}
        .sec-item{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--s2);border-radius:6px;font-size:.82rem}
        .sec-item .sec-nm{flex:1;color:var(--tx)}.sec-item .sec-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:.7rem;padding:2px 4px;border-radius:3px}.sec-item .sec-del:hover{color:var(--rd)}
        .sec-add-row{display:flex;gap:4px;margin-top:4px}
        .tr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border-radius:8px;margin-bottom:4px}
        .tr-info{flex:1;min-width:0}.tr-name{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr-meta{font-size:.68rem;color:var(--tx3)}

        @media(max-width:768px){
            .menu-t{display:block}
            .sb{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .25s;width:250px;min-width:250px}.sb.open{left:0}
            .grid{grid-template-columns:1fr;padding:10px}.tb{padding:0 10px}.fr3{grid-template-columns:1fr}
            .h-right .hm{display:none}.mo{padding:8px}.cat-grip{opacity:.7}
            .trash-fab{bottom:16px;right:16px;width:40px;height:40px}
            .ws-layout{flex-direction:column}.ws-left{border-right:none;border-bottom:1px solid var(--bd);max-height:45%}.ws-right{width:100%;min-width:0;flex:1}
        }
        @media(max-width:480px){html{font-size:14px}}
        @media(min-width:1400px){.grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
    </style>
</head>
<body>
<header class="header">
    <div class="h-left"><button class="menu-t" onclick="App.toggleSb()">☰</button><div class="logo">Nhà Tù <em>Prompt</em></div></div>
    <div class="h-right"><button class="btn btn-p" onclick="App.openAdd()">+ <span class="hm">Thêm prompt</span></button><button class="btn" onclick="App.openCatAdd()"><span class="hm">Thêm danh mục</span></button></div>
</header>
<div class="layout">
    <aside class="sb" id="sb">
        <div class="sb-sec"><div class="sb-search"><input type="text" id="sInput" placeholder="Tìm kiếm..." oninput="App.search()" autocomplete="off"></div></div>
        <div style="padding:2px 10px 0"><div class="sb-t">Thiết bị</div></div>
        <div class="seg"><button class="seg-b on" data-dv="all" onclick="App.devFilter('all')">Tất cả</button><button class="seg-b" data-dv="pc" onclick="App.devFilter('pc')">PC</button><button class="seg-b" data-dv="phone" onclick="App.devFilter('phone')">Phone</button></div>
        <div class="ai-sec"><div class="sb-t">Agent AI</div><div class="ai-list" id="aiList"></div><div class="ai-add-row"><input type="text" class="ai-inp" id="aiInput" placeholder="Tên AI..." maxlength="30" onkeydown="if(event.key==='Enter')App.addAi()"><button class="ai-abtn" onclick="App.addAi()">Thêm</button></div></div>
        <div style="padding:6px 10px 2px"><div class="sb-t">Danh mục</div></div>
        <div class="cat-list" id="catL"></div>
        <div class="stats" id="sts"></div>
    </aside>
    <div class="sb-ov" id="sbOv" onclick="App.toggleSb()"></div>
    <main class="main">
        <div class="tb"><div class="tb-l"><div class="tb-cat" id="tbCat">Tất cả</div><div class="tb-cnt" id="tbCnt"></div></div>
        <div class="tb-r"><button class="btn btn-s" id="secBtn" onclick="App.openSecMo()" style="display:none">Ngăn</button><select class="tb-sort" id="secFilter" onchange="App.render()" style="display:none"></select><select class="tb-sort" id="tbSort" onchange="App.render()"><option value="newest">Mới nhất</option><option value="oldest">Cũ nhất</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div></div>
        <div class="grid" id="grid"></div>
    </main>
</div>

// AI

// Categories
function renderCats(){var l=$('catL'),co={},t=prompts.length;for(var i=0;i<prompts.length;i++)co[prompts[i].category]=(co[prompts[i].category]||0)+1;var h='<div class="cat-i'+(aCat==='all'?' on':'')+'" onclick="App.selCat(\'all\')"><div class="cat-d" style="background:#555"></div><div class="cat-n">Tất cả</div><div class="cat-c">'+t+'</div></div>';for(var j=0;j<cats.length;j++){var c=cats[j],n=co[c.id]||0;h+='<div class="cat-i'+(aCat===c.id?' on':'')+'" data-cat-id="'+c.id+'"><span class="cat-grip" data-grip="'+c.id+'">⠿</span><div class="cat-d" style="background:'+c.color+'"></div><div class="cat-n" onclick="App.selCat(\''+c.id+'\')">'+esc(c.name)+'</div><div class="cat-c">'+n+'</div><div class="cat-a"><button class="cat-ab" onclick="event.stopPropagation();App.editCat(\''+c.id+'\')">sửa</button><button class="cat-ab" onclick="event.stopPropagation();App.delCat(\''+c.id+'\')">xóa</button></div></div>'}l.innerHTML=h;bindDrag();rStats();uTF()}
function uTF(){var e=$('trashCnt');e.textContent=trash.length||'';e.classList.toggle('hide',!trash.length)}

// Drag

function oDM(e){if(!drag.active)return;cHL();var t=gDT(e.clientX,e.clientY);if(t&&t.id!==drag.catId){var r=t.el.getBoundingClientRect();if(e.clientY<r.top+r.height/2)t.el.classList.add('drag-over');else t.el.classList.add('drag-over-below')}}

// Filter
function getF(){var list=[];for(var i=0;i<prompts.length;i++){var p=prompts[i];if(aCat!=='all'&&p.category!==aCat)continue;if(aDev!=='all'&&p.device!==aDev&&p.device!=='both')continue;if(aAi!=='all'&&(p.ai||'')!==aAi)continue;var sf=$('secFilter');if(sf&&sf.style.display!=='none'){var sv=sf.value;if(sv&&sv!=='all'&&aCat!=='all'){if(sv==='__none__'){if(p.section)continue}else{if((p.section||'')!==sv)continue}}}if(sQ){var nm=(p.name||'').toLowerCase(),ct=(p.content||'').toLowerCase(),nt=(p.note||'').toLowerCase(),ai=(p.ai||'').toLowerCase();if(nm.indexOf(sQ)===-1&&ct.indexOf(sQ)===-1&&nt.indexOf(sQ)===-1&&ai.indexOf(sQ)===-1)continue}list.push(p)}var sort=$('tbSort').value;list.sort(function(a,b){switch(sort){case'oldest':return(a.created||0)-(b.created||0);case'az':return(a.name||'').localeCompare(b.name||'','vi');case'za':return(b.name||'').localeCompare(a.name||'','vi');default:return(b.created||0)-(a.created||0)}});return list}
function render(){var g=$('grid'),list=getF();$('tbCnt').textContent=list.length+' prompt';if(!list.length){g.innerHTML='<div class="empty"><div class="empty-tx">'+(sQ?'Không tìm thấy':'Chưa có prompt')+'</div><div class="empty-sub">'+(sQ?'Thử từ khóa khác':'Bấm + Thêm prompt')+'</div></div>';return}var sf=$('secFilter'),ss=aCat!=='all'&&sf&&sf.style.display!=='none'&&sf.value==='all';ss?rGroup(list):rFlat(list)}
function rFlat(l){var p=[];for(var i=0;i<l.length;i++)p.push(bCard(l[i]));$('grid').innerHTML=p.join('')}
function rGroup(l){var c=fC(aCat);if(!c){rFlat(l);return}var gr={},ns=[];for(var i=0;i<l.length;i++){var s=l[i].section||'';if(s&&c.sections.indexOf(s)!==-1){if(!gr[s])gr[s]=[];gr[s].push(l[i])}else ns.push(l[i])}var pa=[];for(var j=0;j<c.sections.length;j++){var sn=c.sections[j],it=gr[sn]||[];if(!it.length)continue;pa.push('<div class="section-div"><span class="section-name">'+esc(sn)+'</span><span class="section-line"></span></div>');for(var k=0;k<it.length;k++)pa.push(bCard(it[k]))}if(ns.length){if(pa.length)pa.push('<div class="section-div"><span class="section-name">Chưa phân ngăn</span><span class="section-line"></span></div>');for(var m=0;m<ns.length;m++)pa.push(bCard(ns[m]))}$('grid').innerHTML=pa.join('')}

function bCard(p){
    var cat=fC(p.category),cn=cat?cat.name:'—',cc=cat?cat.color:'#555';
    var dv='';if(p.device==='pc')dv='<span class="tag tag-pc">PC</span>';else if(p.device==='phone')dv='<span class="tag tag-ph">PHONE</span>';else dv='<span class="tag tag-bt">ALL</span>';
    var ai=p.ai?'<span class="tag tag-ai">'+esc(p.ai)+'</span>':'';
    var sec=p.section?'<span class="tag tag-sec">'+esc(p.section)+'</span>':'';
    return '<div class="card"><div class="card-h"><div class="card-t">'+esc(p.name)+'</div><div class="tags">'+sec+ai+dv+'</div></div><div class="card-p">'+esc(p.content)+'</div><div class="card-m"><span class="card-tag" style="border-left:2px solid '+cc+';padding-left:6px">'+esc(cn)+'</span><span class="card-dt">'+fmtD(p.created)+'</span></div><div class="card-act"><button class="btn btn-s" onclick="event.stopPropagation();App.view(\''+p.id+'\')">Xem</button><button class="btn btn-s" onclick="event.stopPropagation();App.copy(\''+p.id+'\')">Chép</button><button class="btn btn-s" onclick="event.stopPropagation();App.editMeta(\''+p.id+'\')">Sửa</button><button class="btn btn-s btn-d" onclick="event.stopPropagation();App.delPr(\''+p.id+'\')">Xóa</button></div></div>';
}

// Variables
function exV(c){if(!c)return[];var r=/\{\{([^}]+)\}\}/g,m,v=[],s={};while((m=r.exec(c))!==null){var k=m[1].trim();if(k&&!s[k]){s[k]=true;v.push(k)}}return v}
function fillC(c,vals){return c.replace(/\{\{([^}]+)\}\}/g,function(m,k){var v=k.trim();return(vals[v]!==undefined&&vals[v]!=='')?vals[v]:m})}
function hlFill(c,vals){return esc(c).replace(/\{\{([^}]+)\}\}/g,function(m,k){var v=k.trim();if(vals[v]!==undefined&&vals[v]!=='')return '<mark>'+esc(vals[v])+'</mark>';return m})}

// Workspace
function viewPr(id){
    var p=fP(id);if(!p)return;_wsId=id;
    var cat=fC(p.category);$('wsTitle').textContent=p.name;
    var dv=p.device==='pc'?'PC':p.device==='phone'?'Phone':'Cả hai';
    var aiH=p.ai?'<span class="tag tag-ai">'+esc(p.ai)+'</span>':'';
    var secH=p.section?'<span class="tag tag-sec">'+esc(p.section)+'</span>':'';
    $('wsMeta').innerHTML='<span class="card-tag" style="border-left:2px solid '+(cat?cat.color:'#555')+';padding-left:6px">'+esc(cat?cat.name:'—')+'</span>'+secH+aiH+'<span class="tag tag-pc">'+dv+'</span><span class="card-dt">'+fmtD(p.created)+'</span>';
    $('wsContent').innerHTML=esc(p.content);
    if(p.note){$('wsNote').textContent=p.note;$('wsNoteWrap').style.display=''}else $('wsNoteWrap').style.display='none';
    $('wsScratch').value='';
    var vars=exV(p.content),fi=$('wsFields');
    $('wsCopyBtn').textContent=vars.length?'Chép kết quả':'Sao chép';
    $('wsCopyBtn').onclick=vars.length?function(){cpFilled()}:function(){doCopy(p.content)};
    if(vars.length){
        $('wsRTitle').textContent='Điền thông tin ('+vars.length+' biến)';
        var h='';for(var i=0;i<vars.length;i++)h+='<div class="ws-field"><label class="ws-field-label">'+esc(vars[i])+'</label><input class="ws-field-input" data-var="'+esc(vars[i])+'" placeholder="'+esc(vars[i])+'..." oninput="App.wsUp()"></div>';
        fi.innerHTML=h;
    }else{
        $('wsRTitle').textContent='Ghi chú tạm';
        fi.innerHTML='';
    }
    openMo('mWs');
    if(vars.length){var f1=fi.querySelector('.ws-field-input');if(f1)setTimeout(function(){f1.focus()},150)}
}
function wsUp(){var p=fP(_wsId);if(!p)return;var inputs=document.querySelectorAll('#wsFields .ws-field-input');var vals={};for(var i=0;i<inputs.length;i++)vals[inputs[i].getAttribute('data-var')]=inputs[i].value;$('wsContent').innerHTML=hlFill(p.content,vals)}
function cpFilled(){var p=fP(_wsId);if(!p)return;var inputs=document.querySelectorAll('#wsFields .ws-field-input');var vals={};for(var i=0;i<inputs.length;i++)vals[inputs[i].getAttribute('data-var')]=inputs[i].value;doCopy(fillC(p.content,vals))}

// Content Editor (separate modal)
function openCE(){var p=fP(_wsId);if(!p)return;$('ceArea').value=p.content;openMo('mCE');setTimeout(function(){$('ceArea').focus()},100)}
function closeCE(){closeMo('mCE')}
function saveCE(){var p=fP(_wsId);if(!p)return;var v=($('ceArea').value||'').trim();if(!v){toast('Nội dung không được trống','err');return}p.content=v;p.updated=Date.now();save();closeMo('mCE');viewPr(_wsId);renderCats();render();toast('Đã lưu nội dung','ok')}

function doCopy(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast('Đã sao chép','ok')}).catch(function(){fbCp(t)})}else fbCp(t)}
function fbCp(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy')?toast('Đã sao chép','ok'):toast('Lỗi','err')}catch(e){toast('Lỗi','err')}document.body.removeChild(ta)}

// Cat CRUD
function openCatAdd(){$('mCtT').textContent='Thêm danh mục';$('eCatId').value='';$('cName').value='';$('cColor').value='#635bff';$('cHex').value='#635bff';$('cPrev').style.background='#635bff';openMo('mCt');setTimeout(function(){$('cName').focus()},100)}
function editCat(id){var c=fC(id);if(!c)return;$('mCtT').textContent='Sửa danh mục';$('eCatId').value=id;$('cName').value=c.name;$('cColor').value=c.color;$('cHex').value=c.color;$('cPrev').style.background=c.color;openMo('mCt');setTimeout(function(){$('cName').focus()},100)}
function saveCat(){var e=($('eCatId').value||'').trim(),n=($('cName').value||'').trim(),c=$('cColor').value;if(!n){toast('Nhập tên','err');return}for(var i=0;i<cats.length;i++)if(cats[i].name.toLowerCase()===n.toLowerCase()&&cats[i].id!==e){toast('Đã tồn tại','err');return}if(e){var cat=fC(e);if(cat){cat.name=n;cat.color=c;toast('Đã cập nhật','ok')}}else{cats.push({id:uid(),name:n,color:c,sections:[]});toast('Đã thêm','ok')}save();renderCats();updCatSel();updTb();closeMo('mCt')}
function delCat(id){var c=fC(id);if(!c)return;var cnt=0;for(var i=0;i<prompts.length;i++)if(prompts[i].category===id)cnt++;confirm2('Xóa "'+trn(c.name,25)+'"?',cnt?cnt+' prompt chuyển danh mục khác.':'Không thể hoàn tác.',function(){if(cnt){var fb=null;for(var j=0;j<cats.length;j++)if(cats[j].id!==id){fb=cats[j].id;break}if(!fb){fb=uid();cats.push({id:fb,name:'Khác',color:'#06b6d4',sections:[]})}for(var k=0;k<prompts.length;k++)if(prompts[k].category===id){prompts[k].category=fb;prompts[k].section=''}}cats=cats.filter(function(x){return x.id!==id});if(aCat===id)aCat='all';save();renderCats();render();updTb();updCatSel();uSF();closeMo('mCf');toast('Đã xóa','ok')})}

// Prompt CRUD
function openAdd(){$('mPrT').textContent='Thêm prompt';$('eId').value='';$('pName').value='';$('pCont').value='';$('pDev').value='both';$('pNote').value='';$('pContWrap').style.display='';updCatSel();updAiSel();$('pAi').value='';if(aCat!=='all')$('pCat').value=aCat;if(aAi!=='all')$('pAi').value=aAi;openMo('mPr');setTimeout(function(){$('pName').focus()},100)}

// Edit metadata only (not content)
function editMeta(id){var p=fP(id);if(!p)return;$('mPrT').textContent='Sửa thông tin';$('eId').value=id;$('pName').value=p.name;$('pDev').value=p.device||'both';$('pNote').value=p.note||'';$('pContWrap').style.display='none'; // Hide content field
updCatSel();updAiSel();$('pCat').value=p.category;$('pAi').value=p.ai||'';closeMo('mWs');openMo('mPr');setTimeout(function(){$('pName').focus()},100)}

function savePr(){var e=($('eId').value||'').trim(),n=($('pName').value||'').trim(),cat=$('pCat').value,dv=$('pDev').value,ai=$('pAi').value||'',ct=($('pCont').value||'').trim(),nt=($('pNote').value||'').trim();if(!n){toast('Nhập tên','err');$('pName').focus();return}if(!cat||!fC(cat)){toast('Chọn danh mục','err');return}var now=Date.now();if(e){var p=fP(e);if(p){p.name=n;p.category=cat;p.device=dv;p.ai=ai;p.note=nt;p.updated=now;toast('Đã cập nhật','ok')}else{toast('Không tìm thấy','err');return}}else{if(!ct){toast('Nhập nội dung','err');$('pCont').focus();return}prompts.push({id:uid(),name:n,category:cat,device:dv,ai:ai,section:'',content:ct,note:nt,created:now,updated:now});toast('Đã thêm','ok')}save();renderCats();render();closeMo('mPr')}

// Trash
function delPr(id){var idx=-1;for(var i=0;i<prompts.length;i++)if(prompts[i].id===id){idx=i;break}if(idx===-1)return;var item=prompts.splice(idx,1)[0];item.deletedAt=Date.now();trash.push(item);save();renderCats();render();uTF();closeMo('mWs');toast('Đã chuyển vào thùng rác','ok')}
function openTrashMo(){rTrL();openMo('mTr')}
function rTrL(){var b=$('trBody');$('trClearBtn').style.display=trash.length?'':'none';if(!trash.length){b.innerHTML='<div class="empty" style="min-height:80px"><div class="empty-tx">Thùng rác trống</div></div>';return}var h='';for(var i=trash.length-1;i>=0;i--){var p=trash[i],cat=fC(p.category),cn=cat?cat.name:'—';h+='<div class="tr-item"><div class="tr-info"><div class="tr-name">'+esc(p.name)+'</div><div class="tr-meta">'+esc(cn)+' · '+fmtD(p.deletedAt)+'</div></div><button class="btn btn-s btn-w" onclick="App.restore(\''+p.id+'\')">Khôi phục</button><button class="btn btn-s btn-d" onclick="App.permDel(\''+p.id+'\')">Xóa hẳn</button></div>'}b.innerHTML=h}
function restorePr(id){var idx=-1;for(var i=0;i<trash.length;i++)if(trash[i].id===id){idx=i;break}if(idx===-1)return;var it=trash.splice(idx,1)[0];delete it.deletedAt;if(!fC(it.category)){if(cats.length)it.category=cats[0].id;else{var fid=uid();cats.push({id:fid,name:'Khôi phục',color:'#06b6d4',sections:[]});it.category=fid}}prompts.push(it);save();renderCats();render();rTrL();uTF();toast('Đã khôi phục','ok')}
function permDel(id){
    confirm2('Xóa vĩnh viễn?','Không thể khôi phục.',function(){
        trash=trash.filter(function(x){return x.id!==id});
        save();
        rTrL();
        uTF();
        closeMo('mCf');
        toast('Đã xóa vĩnh viễn','ok');
    },'Xóa vĩnh viễn');
}
function clearTrash(){if(!trash.length)return;confirm2('Dọn sạch?',trash.length+' mục mất vĩnh viễn.',function(){trash=[];save();rTrL();uTF();closeMo('mCf');toast('Đã dọn sạch','ok')},'Dọn sạch')}

// Keyboard
document.addEventListener('keydown',function(e){if(e.target.id==='pCont'&&e.key==='Tab'){e.preventDefault();var ta=e.target,s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.substring(0,s)+'  '+ta.value.substring(en);ta.selectionStart=ta.selectionEnd=s+2}if(e.target.id==='ceArea'&&e.key==='Tab'){e.preventDefault();var ta2=e.target,s2=ta2.selectionStart,en2=ta2.selectionEnd;ta2.value=ta2.value.substring(0,s2)+'  '+ta2.value.substring(en2);ta2.selectionStart=ta2.selectionEnd=s2+2}if((e.ctrlKey||e.metaKey)&&e.key==='s'){if($('mPr').classList.contains('show')){e.preventDefault();savePr()}if($('mCE').classList.contains('show')){e.preventDefault();saveCE()}}});

function init(){load();renderCats();renderAis();uSF();render();updTb();updCatSel();updAiSel();uTF();history.replaceState({cat:'all'},'')}

window.App={toggleSb:toggleSb,selCat:selCat,devFilter:devFilter,aiFilter:aiFilter,addAi:addAi,delAi:delAi,search:function(){clearTimeout(_st);_st=setTimeout(doSearch,200)},render:render,openAdd:openAdd,openCatAdd:openCatAdd,editCat:editCat,delCat:delCat,saveCat:saveCat,savePr:savePr,editMeta:editMeta,view:viewPr,copy:function(id){var p=fP(id);if(p)doCopy(p.content)},delPr:delPr,restore:restorePr,permDel:permDel,clearTrash:clearTrash,openTrash:openTrashMo,openMo:openMo,closeMo:closeMo,syncColor:syncColor,openSecMo:openSecMo,addSec:addSec,delSec:delSec,wsUp:wsUp,openCE:openCE,closeCE:closeCE,saveCE:saveCE};
init();
})();
</script>
</body>
