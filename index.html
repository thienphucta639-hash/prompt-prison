<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhà Tù Prompt</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#08080c;--s1:#101016;--s2:#18181f;--s3:#222230;--bd:#1e1e2e;--bd2:#2a2a3d;--tx:#d4d4e0;--tx2:#7c7c9a;--tx3:#4a4a62;--ac:#635bff;--ac2:#8b83ff;--ac3:#a78bfa;--gn:#10b981;--rd:#ef4444;--yw:#f59e0b;--g1:linear-gradient(135deg,#635bff,#a78bfa);--r:8px;--tr:all .2s ease}
        html{font-size:15px}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5;overflow:hidden}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
        button,select,input,textarea{font-family:inherit}::selection{background:rgba(99,91,255,.3)}
        .header{position:sticky;top:0;z-index:100;background:rgba(16,16,22,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:48px}
        .h-left{display:flex;align-items:center;gap:10px}
        .logo{font-size:1rem;font-weight:600;color:var(--tx)}.logo em{font-style:normal;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .h-right{display:flex;gap:6px}
        .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--s2);color:var(--tx2);font-size:.8rem;cursor:pointer;transition:var(--tr);white-space:nowrap;user-select:none}.btn:hover{color:var(--tx);background:var(--s3);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
        .btn-p{background:var(--ac);border-color:transparent;color:#fff}.btn-p:hover{background:var(--ac2);box-shadow:0 4px 16px rgba(99,91,255,.25)}
        .btn-d{color:var(--rd);border-color:rgba(239,68,68,.2)}.btn-d:hover{background:rgba(239,68,68,.08)}
        .btn-s{padding:3px 8px;font-size:.75rem}
        .btn-w{color:var(--gn);border-color:rgba(16,185,129,.2)}.btn-w:hover{background:rgba(16,185,129,.08)}
        .layout{display:flex;height:calc(100vh - 48px)}
        .sb{width:240px;min-width:240px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
        .sb-sec{padding:10px 10px 6px}
        .sb-t{font-size:.65rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin-bottom:4px;padding:0 6px;font-weight:600}
        .sb-search input{width:100%;padding:7px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;outline:none}.sb-search input:focus{border-color:var(--ac)}
        .sb-search input::placeholder{color:var(--tx3)}
        .seg{display:flex;gap:2px;padding:4px 10px;margin-bottom:2px}
        .seg-b{flex:1;padding:4px 0;border:none;border-radius:6px;background:transparent;color:var(--tx3);font-size:.72rem;cursor:pointer;text-align:center;font-weight:500;transition:var(--tr)}.seg-b:hover{color:var(--tx2)}.seg-b.on{background:var(--s3);color:var(--tx)}
        .ai-sec{padding:4px 10px 8px;border-bottom:1px solid var(--bd)}
        .ai-list{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
        .ai-tag{padding:2px 7px;border:1px solid var(--bd);border-radius:5px;font-size:.68rem;cursor:pointer;transition:var(--tr);color:var(--tx3);font-weight:500}.ai-tag:hover{color:var(--tx2)}.ai-tag.on{background:var(--ac);border-color:var(--ac);color:#fff}
        .ai-tag .x{margin-left:3px;opacity:.5;cursor:pointer;font-size:.6rem}.ai-tag .x:hover{opacity:1}
        .ai-add-row{display:flex;gap:3px;margin-top:5px}
        .ai-inp{flex:1;padding:3px 7px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;color:var(--tx);font-size:.7rem;outline:none}.ai-inp:focus{border-color:var(--ac)}
        .ai-abtn{padding:3px 7px;border:1px solid var(--bd);border-radius:5px;background:var(--s2);color:var(--tx2);font-size:.7rem;cursor:pointer}.ai-abtn:hover{background:var(--ac);color:#fff}
        .cat-list{flex:1;overflow-y:auto;padding:4px 6px 6px}
        .cat-i{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.82rem;transition:background .15s,color .15s;user-select:none;color:var(--tx2)}.cat-i:hover{background:var(--s2);color:var(--tx)}.cat-i.on{background:rgba(99,91,255,.08);color:var(--ac2)}
        .cat-i.drag-over{box-shadow:0 -2px 0 0 var(--ac) inset}.cat-i.drag-below{box-shadow:0 2px 0 0 var(--ac) inset}.cat-i.dragging{opacity:.4}
        .cat-grip{cursor:grab;color:var(--tx3);font-size:.7rem;padding:2px;opacity:0;transition:opacity .15s}.cat-i:hover .cat-grip{opacity:1}
        .cat-d{width:6px;height:6px;border-radius:2px;flex-shrink:0}.cat-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cat-c{font-size:.68rem;color:var(--tx3);min-width:16px;text-align:right}.cat-i.on .cat-c{color:var(--ac)}
        .cat-a{display:flex;gap:1px;opacity:0;transition:opacity .15s;flex-shrink:0}.cat-i:hover .cat-a{opacity:1}
        .cat-ab{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px 3px;font-size:.65rem;border-radius:3px}.cat-ab:hover{color:var(--tx);background:var(--s3)}
        .drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:var(--s2);border:1px solid var(--ac);border-radius:6px;padding:6px 10px;font-size:.82rem;color:var(--ac2);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:200px}
        .stats{padding:6px 12px;border-top:1px solid var(--bd);font-size:.65rem;color:var(--tx3);display:flex;gap:10px}
        .trash-fab{position:fixed;bottom:20px;right:20px;z-index:90;width:44px;height:44px;border-radius:50%;background:var(--s2);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--tr);font-size:1.1rem;box-shadow:0 4px 16px rgba(0,0,0,.3)}.trash-fab:hover{transform:scale(1.1);border-color:var(--rd)}
        .trash-fab .tc{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-size:.58rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 4px}.trash-fab .tc.h{display:none}
        .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
        .tb{padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:40px;border-bottom:1px solid var(--bd);background:var(--s1);gap:8px}
        .tb-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
        .tb-cat{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}.tb-cnt{font-size:.7rem;color:var(--tx3)}
        .tb-r{display:flex;align-items:center;gap:6px}
        .tb-sort{padding:4px 8px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx2);font-size:.75rem;outline:none;cursor:pointer}
        .section-div{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 0 4px}.section-line{flex:1;height:1px;background:var(--bd2)}.section-name{font-size:.78rem;font-weight:600;color:var(--ac2)}
        .grid{flex:1;overflow-y:auto;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;align-content:start}
        .card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:var(--tr);position:relative}.card::after{content:'';position:absolute;inset:-1px;border-radius:10px;background:var(--g1);opacity:0;transition:opacity .3s;z-index:-1}.card:hover{border-color:transparent;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}.card:hover::after{opacity:.15}
        .card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.card-t{font-size:.88rem;font-weight:600;line-height:1.35;flex:1;word-break:break-word}.tags{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}
        .tag{font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:500;text-transform:uppercase}.tag-pc{background:rgba(99,91,255,.1);color:var(--ac2)}.tag-ph{background:rgba(16,185,129,.1);color:var(--gn)}.tag-bt{background:rgba(167,139,250,.1);color:var(--ac3)}.tag-ai{background:rgba(244,114,182,.1);color:#f472b6}.tag-sec{background:rgba(99,91,255,.08);color:var(--ac3);font-size:.58rem}
        .card-p{font-size:.78rem;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
        .card-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.card-tag{font-size:.65rem;padding:1px 6px;border-radius:3px;color:var(--tx3)}.card-dt{font-size:.65rem;color:var(--tx3);margin-left:auto}
        .card-act{display:flex;gap:3px;padding-top:8px;border-top:1px solid var(--bd)}.card-act .btn{flex:1;justify-content:center}
        .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px;padding:40px 20px;text-align:center;grid-column:1/-1;min-height:200px}.empty-tx{font-size:.88rem;color:var(--tx2)}.empty-sub{font-size:.78rem}
        .mo{display:none;position:fixed;inset:0;background:rgba(4,4,8,.75);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:16px}.mo.show{display:flex}
        .mo-box{background:var(--s1);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:580px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;animation:moIn .2s ease;box-shadow:0 24px 64px rgba(0,0,0,.5)}
        @keyframes moIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .mo-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}.mo-t{font-size:.92rem;font-weight:600;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .mo-x{background:none;border:none;color:var(--tx3);font-size:1.1rem;cursor:pointer;padding:4px 6px;border-radius:4px;line-height:1;transition:var(--tr)}.mo-x:hover{color:var(--tx);background:var(--s2)}
        .mo-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}.mo-f{padding:10px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:6px}
        .fg{display:flex;flex-direction:column;gap:4px}.fl{font-size:.75rem;font-weight:500;color:var(--tx2)}.fl .req{color:var(--rd)}
        .fi{padding:7px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.84rem;outline:none}.fi:focus{border-color:var(--ac)}
        .ft{padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;outline:none;resize:vertical;min-height:130px;font-family:Consolas,Monaco,monospace;line-height:1.65}.ft:focus{border-color:var(--ac)}
        .ft-note{min-height:60px;font-family:inherit;font-size:.84rem;color:#c8c8e0}
        .fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
        .color-row{display:flex;align-items:center;gap:8px}.color-prev{width:32px;height:32px;border-radius:6px;border:2px solid var(--bd2)}.fi-color{flex:1;padding:3px;height:36px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;cursor:pointer}
        .ws-box{max-width:960px;max-height:94vh}
        .ws-layout{display:flex;flex:1;overflow:hidden}
        .ws-left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--bd);overflow:hidden}
        .ws-right{width:360px;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
        .ws-pt{font-size:.68rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;padding:8px 14px 4px}
        .ws-cw{flex:1;overflow-y:auto;padding:4px 14px 10px}
        .ws-ea{width:100%;min-height:200px;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;font-family:Consolas,Monaco,monospace;line-height:1.7;outline:none;resize:vertical}.ws-ea:focus{border-color:var(--ac)}
        .ws-va{font-family:Consolas,Monaco,monospace;font-size:.82rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--tx);padding:8px}
        .ws-va mark{background:rgba(245,158,11,.2);color:var(--yw);border-radius:2px;padding:0 2px}
        .ws-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--bd);font-size:.72rem}
        .ws-nw{border-top:1px solid var(--bd);max-height:30%}.ws-nh{padding:6px 14px}.ws-nl{font-size:.68rem;font-weight:600;color:var(--ac2);text-transform:uppercase;letter-spacing:.5px}.ws-nb{overflow-y:auto;padding:0 14px 10px}.ws-nt{font-size:.82rem;color:#b8b8d0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
        .ws-fi{overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
        .ws-fd{display:flex;flex-direction:column;gap:3px}.ws-fl{font-size:.72rem;color:var(--ac2);font-weight:500}.ws-fin{padding:6px 10px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);font-size:.82rem;outline:none}.ws-fin:focus{border-color:var(--yw)}
        .ws-sc{padding:10px 14px;border-top:1px solid var(--bd);flex:1;display:flex;flex-direction:column;min-height:0}
        .ws-sl{font-size:.68rem;font-weight:600;color:var(--yw);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;flex-shrink:0}
        .ws-sa{width:100%;padding:10px 12px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;color:#c8c8e0;font-size:.84rem;outline:none;resize:none;flex:1;min-height:180px;line-height:1.6;font-family:inherit}.ws-sa:focus{border-color:var(--yw)}.ws-sa::placeholder{color:var(--tx3)}
        .ws-mt{font-size:.6rem;padding:2px 6px;border-radius:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
        .ws-mv{background:rgba(16,185,129,.1);color:var(--gn)}.ws-me{background:rgba(245,158,11,.1);color:var(--yw)}
        .cc{text-align:center;padding:16px 0}.cc p{font-size:.84rem;color:var(--tx2);margin-top:6px}
        .toast-c{position:fixed;top:56px;right:16px;z-index:300;display:flex;flex-direction:column;gap:4px;pointer-events:none}
        .toast{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:.8rem;display:flex;align-items:center;gap:6px;animation:tIn .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:auto;color:var(--tx2)}.toast.ok{border-left:2px solid var(--gn);color:var(--gn)}.toast.err{border-left:2px solid var(--rd);color:var(--rd)}.toast.inf{border-left:2px solid var(--ac);color:var(--ac2)}
        @keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}.toast.out{opacity:0;transform:translateX(20px);transition:all .2s}
        .menu-t{display:none;background:none;border:none;color:var(--tx);font-size:1.1rem;cursor:pointer;padding:4px 8px}.sb-ov{display:none;position:fixed;inset:0;background:rgba(4,4,8,.6);z-index:49}.sb-ov.show{display:block}
        .sec-list{display:flex;flex-direction:column;gap:4px}.sec-item{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--s2);border-radius:6px;font-size:.82rem}.sec-nm{flex:1;color:var(--tx)}.sec-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:.7rem;padding:2px 4px;border-radius:3px}.sec-del:hover{color:var(--rd)}
        .tr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border-radius:8px;margin-bottom:4px}.tr-info{flex:1;min-width:0}.tr-name{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr-meta{font-size:.68rem;color:var(--tx3)}
        @media(max-width:768px){.menu-t{display:block}.sb{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .25s;width:250px;min-width:250px}.sb.open{left:0}.grid{grid-template-columns:1fr;padding:10px}.tb{padding:0 10px}.fr3{grid-template-columns:1fr}.h-right .hm{display:none}.mo{padding:8px}.cat-grip{opacity:.7}.trash-fab{bottom:16px;right:16px;width:40px;height:40px}.ws-layout{flex-direction:column}.ws-left{border-right:none;border-bottom:1px solid var(--bd);max-height:45%}.ws-right{width:100%;min-width:0;flex:1}}
        @media(max-width:480px){html{font-size:14px}}
        @media(min-width:1400px){.grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
    </style>
</head>
<body>
<header class="header"><div class="h-left"><button class="menu-t" onclick="Z.toggleSb()">☰</button><div class="logo">Nhà Tù <em>Prompt</em></div></div><div class="h-right"><button class="btn btn-p" onclick="Z.addPr()">+ <span class="hm">Thêm prompt</span></button><button class="btn" onclick="Z.addCat()"><span class="hm">Thêm danh mục</span></button></div></header>
<div class="layout">
<aside class="sb" id="sb"><div class="sb-sec"><div class="sb-search"><input id="sIn" placeholder="Tìm kiếm..." oninput="Z.sch()" autocomplete="off"></div></div><div style="padding:2px 10px 0"><div class="sb-t">Thiết bị</div></div><div class="seg"><button class="seg-b on" data-d="all" onclick="Z.devF('all')">Tất cả</button><button class="seg-b" data-d="pc" onclick="Z.devF('pc')">PC</button><button class="seg-b" data-d="phone" onclick="Z.devF('phone')">Phone</button></div><div class="ai-sec"><div class="sb-t">Agent AI</div><div class="ai-list" id="aiL"></div><div class="ai-add-row"><input class="ai-inp" id="aiIn" placeholder="Tên AI..." maxlength="30" onkeydown="event.key==='Enter'&&Z.aiAdd()"><button class="ai-abtn" onclick="Z.aiAdd()">Thêm</button></div></div><div style="padding:6px 10px 2px"><div class="sb-t">Danh mục</div></div><div class="cat-list" id="catL"></div><div class="stats" id="sts"></div></aside>
<div class="sb-ov" id="sbOv" onclick="Z.toggleSb()"></div>
<main class="main"><div class="tb"><div class="tb-l"><div class="tb-cat" id="tbCat">Tất cả</div><div class="tb-cnt" id="tbCnt"></div></div><div class="tb-r"><button class="btn btn-s" id="secBtn" onclick="Z.secMo()" style="display:none">Ngăn</button><select class="tb-sort" id="secF" onchange="Z.ren()" style="display:none"></select><select class="tb-sort" id="tbSort" onchange="Z.ren()"><option value="newest">Mới nhất</option><option value="oldest">Cũ nhất</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div></div><div class="grid" id="grid"></div></main>
</div>
<div class="trash-fab" onclick="Z.trMo()" title="Thùng rác">🗑<span class="tc" id="trC"></span></div>

<!-- Add/Edit -->
<div class="mo" id="mPr"><div class="mo-box"><div class="mo-h"><div class="mo-t" id="mPrT"></div><button class="mo-x" onclick="Z.cl('mPr')">✕</button></div><div class="mo-b"><input type="hidden" id="eId"><div class="fg"><label class="fl">Tên <span class="req">*</span></label><input class="fi" id="pNm" maxlength="200"></div><div class="fr3"><div class="fg"><label class="fl">Danh mục <span class="req">*</span></label><select class="fi" id="pCat"></select></div><div class="fg"><label class="fl">Thiết bị</label><select class="fi" id="pDev"><option value="both">Cả hai</option><option value="pc">PC</option><option value="phone">Phone</option></select></div><div class="fg"><label class="fl">Agent AI</label><select class="fi" id="pAi"></select></div></div><div class="fg" id="pCW"><label class="fl">Nội dung <span class="req">*</span></label><textarea class="ft" id="pCt" placeholder="Dùng {{tên}} để tạo biến" rows="8"></textarea></div><div class="fg"><label class="fl">Ghi chú</label><textarea class="ft ft-note" id="pNt" rows="3"></textarea></div></div><div class="mo-f"><button class="btn" onclick="Z.cl('mPr')">Hủy</button><button class="btn btn-p" onclick="Z.savePr()">Lưu</button></div></div></div>

<!-- Workspace -->
<div class="mo" id="mWs"><div class="mo-box ws-box"><div class="mo-h"><div class="mo-t" id="wsT"></div><div style="display:flex;gap:4px;align-items:center"><span class="ws-mt ws-mv" id="wsMt">xem</span><button class="btn btn-s" id="wsToggle" onclick="Z.wsToggle()">Sửa nội dung</button><button class="btn btn-s btn-p" id="wsCp"></button><button class="mo-x" onclick="Z.wsCl()">✕</button></div></div><div class="ws-layout"><div class="ws-left"><div class="ws-meta" id="wsMeta"></div><div class="ws-pt">Nội dung</div><div class="ws-cw" id="wsCW"></div><div class="ws-nw" id="wsNW" style="display:none"><div class="ws-nh"><span class="ws-nl">Ghi chú</span></div><div class="ws-nb"><div class="ws-nt" id="wsNt"></div></div></div></div><div class="ws-right"><div class="ws-pt" id="wsRT"></div><div class="ws-fi" id="wsFi"></div><div class="ws-sc"><div class="ws-sl">Bảng ghi chú tạm</div><textarea class="ws-sa" id="wsSc" placeholder="Nháp thông tin trước khi gửi AI...&#10;(không lưu khi đóng)"></textarea></div></div></div></div></div>

<!-- Category -->
<div class="mo" id="mCt"><div class="mo-box" style="max-width:400px"><div class="mo-h"><div class="mo-t" id="mCtT"></div><button class="mo-x" onclick="Z.cl('mCt')">✕</button></div><div class="mo-b"><input type="hidden" id="eCId"><div class="fg"><label class="fl">Tên <span class="req">*</span></label><input class="fi" id="cNm" maxlength="100"></div><div class="fg"><label class="fl">Màu</label><div class="color-row"><div class="color-prev" id="cPv" style="background:#635bff"></div><input type="color" class="fi-color" id="cCl" value="#635bff" oninput="Z.cPv()"><input class="fi" id="cHx" value="#635bff" maxlength="7" style="width:80px;font-size:.78rem;font-family:monospace" oninput="Z.cSync(this.value)"></div></div></div><div class="mo-f"><button class="btn" onclick="Z.cl('mCt')">Hủy</button><button class="btn btn-p" onclick="Z.saveCat()">Lưu</button></div></div></div>

<!-- Section -->
<div class="mo" id="mSec"><div class="mo-box" style="max-width:400px"><div class="mo-h"><div class="mo-t" id="mSecT"></div><button class="mo-x" onclick="Z.cl('mSec')">✕</button></div><div class="mo-b"><div class="fg"><label class="fl">Các ngăn</label><div class="sec-list" id="secL"></div><div style="display:flex;gap:4px;margin-top:4px"><input class="fi" id="secIn" maxlength="60" style="flex:1" placeholder="Tên ngăn..." onkeydown="event.key==='Enter'&&Z.secAdd()"><button class="btn btn-p btn-s" onclick="Z.secAdd()">Thêm</button></div></div></div><div class="mo-f"><button class="btn" onclick="Z.cl('mSec')">Đóng</button></div></div></div>

<!-- Confirm -->
<div class="mo" id="mCf"><div class="mo-box" style="max-width:360px"><div class="mo-h"><div class="mo-t">Xác nhận</div><button class="mo-x" onclick="Z.cfNo()">✕</button></div><div class="mo-b"><div class="cc"><strong id="cfTx"></strong><p id="cfSb"></p></div></div><div class="mo-f"><button class="btn" onclick="Z.cfNo()">Hủy</button><button class="btn btn-d" id="cfBt" onclick="Z.cfYes()">Xóa</button></div></div></div>

<!-- Trash -->
<div class="mo" id="mTr"><div class="mo-box" style="max-width:620px"><div class="mo-h"><div class="mo-t">Thùng rác</div><button class="mo-x" onclick="Z.cl('mTr')">✕</button></div><div class="mo-b" id="trB" style="max-height:60vh"></div><div class="mo-f"><button class="btn btn-d" id="trClr" onclick="Z.trClr()" style="margin-right:auto">Dọn sạch</button><button class="btn" onclick="Z.cl('mTr')">Đóng</button></div></div></div>

<div class="toast-c" id="toastC"></div>
<script>
!function(){"use strict";
var KEY='ntp_final_v1';
// === MIGRATION: read ALL old keys, merge, never lose data ===
!function(){
    if(localStorage.getItem(KEY))return;
    var allCats=[],allPr=[],allAi=[],allTr=[],ids={};
    ['ntp_v5','ntp_v4','pm_data_v3','pm_data_v2','promptManager'].forEach(function(k){
        var raw=localStorage.getItem(k);if(!raw)return;
        try{var d=JSON.parse(raw);
            (d.cats||d.categories||[]).forEach(function(c){if(c&&c.id&&!ids['c'+c.id]){ids['c'+c.id]=1;if(!Array.isArray(c.sections))c.sections=[];allCats.push(c)}});
            (d.prompts||[]).forEach(function(p){if(p&&p.id&&p.name&&p.content&&!ids['p'+p.id]){ids['p'+p.id]=1;allPr.push(p)}});
            (d.ais||[]).forEach(function(a){if(a&&!ids['a'+a.toUpperCase()]){ids['a'+a.toUpperCase()]=1;allAi.push(a.toUpperCase())}});
            (d.trash||[]).forEach(function(t){if(t&&t.id&&!ids['t'+t.id]){ids['t'+t.id]=1;allTr.push(t)}});
        }catch(e){}
    });
    if(allCats.length||allPr.length){
        localStorage.setItem(KEY,JSON.stringify({cats:allCats,prompts:allPr,ais:allAi.length?allAi:['GEMINI','ARENA.AI','GAMMA','CANVA','PPT COPILOT'],trash:allTr}));
    }
}();

var DC=[{id:'cat_code',name:'Prompt cho Code',color:'#3b82f6',sections:[]},{id:'cat_ai',name:'Prompt cho AI',color:'#635bff',sections:[]},{id:'cat_ppt',name:'Prompt cho PPT',color:'#f97316',sections:[]},{id:'cat_write',name:'Prompt cho Viết',color:'#10b981',sections:[]},{id:'cat_img',name:'Prompt cho Hình Ảnh',color:'#ec4899',sections:[]},{id:'cat_other',name:'Khác',color:'#06b6d4',sections:[]}];
var DA=['GEMINI','ARENA.AI','GAMMA','CANVA','PPT COPILOT'];
var C=[],P=[],AI=[],TR=[];
var aCat='all',aDev='all',aAi='all',sQ='',_st,_wi,_we=false,_cfn=null;
var hist=['all'];
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function esc(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmt(ts){if(!ts)return'';var d=new Date(ts);return isNaN(d)?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function trn(s,n){return s&&s.length>n?s.substr(0,n)+'...':s||''}

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);C=o.cats||[];P=o.prompts||[];AI=o.ais||[];TR=o.trash||[]}else{C=JSON.parse(JSON.stringify(DC));P=[];AI=DA.slice();TR=[]}}catch(e){C=JSON.parse(JSON.stringify(DC));P=[];AI=DA.slice();TR=[]}
P=P.filter(function(p){return p&&p.id&&p.name&&p.content});TR=TR.filter(function(p){return p&&p.id&&p.name&&p.content});C.forEach(function(c){if(!Array.isArray(c.sections))c.sections=[]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cats:C,prompts:P,ais:AI,trash:TR}))}catch(e){toast('Lỗi lưu','err')}}
function toast(m,t){var c=$('toastC'),e=document.createElement('div');e.className='toast '+(t==='ok'?'ok':t==='err'?'err':'inf');e.textContent=m;c.appendChild(e);setTimeout(function(){e.classList.add('out');setTimeout(function(){e.remove()},300)},2500)}
function op(i){$(i).classList.add('show')}
function cl(i){$(i).classList.remove('show')}

// === CONFIRM ===
function cf(title,sub,btn,fn){$('cfTx').textContent=title;$('cfSb').textContent=sub;$('cfBt').textContent=btn||'Xóa';_cfn=fn;op('mCf')}
function cfYes(){var fn=_cfn;_cfn=null;cl('mCf');if(fn)setTimeout(fn,30)}
function cfNo(){_cfn=null;cl('mCf')}

// Modal close
document.addEventListener('click',function(e){if(e.target.classList.contains('mo')&&e.target.classList.contains('show')&&e.target.id!=='mCf')e.target.classList.remove('show')});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=document.querySelectorAll('.mo.show');if(m.length){var last=m[m.length-1];if(last.id==='mCf')cfNo();else last.classList.remove('show')}}});

function toggleSb(){$('sb').classList.toggle('open');$('sbOv').classList.toggle('show')}
function closeSbM(){if(innerWidth<=768){$('sb').classList.remove('open');$('sbOv').classList.remove('show')}}
function pushH(c){hist.push(c);history.pushState(null,'')}
addEventListener('popstate',function(){if(hist.length>1){hist.pop();aCat=hist[hist.length-1]||'all';rAll()}});
function fC(id){return C.find(function(c){return c.id===id})}
function fP(id){return P.find(function(p){return p.id===id})}

// AI
function rAi(){var h='<span class="ai-tag'+(aAi==='all'?' on':'')+'" onclick="Z.aiF(\'all\')">Tất cả</span>';AI.forEach(function(a){h+='<span class="ai-tag'+(aAi===a?' on':'')+'" onclick="Z.aiF(\''+esc(a)+'\')">'+esc(a)+'<span class="x" onclick="event.stopPropagation();Z.aiDel(\''+esc(a)+'\')">✕</span></span>'});$('aiL').innerHTML=h}
function aiAdd(){var v=($('aiIn').value||'').trim().toUpperCase();if(!v)return toast('Nhập tên','err');if(AI.indexOf(v)>-1)return toast('Đã tồn tại','err');AI.push(v);$('aiIn').value='';save();rAi();uAiS();toast('Đã thêm','ok')}
function aiDel(n){cf('Xóa "'+n+'"?','Prompt sẽ bỏ agent.','Xóa',function(){AI=AI.filter(function(a){return a!==n});P.forEach(function(p){if(p.ai===n)p.ai=''});if(aAi===n)aAi='all';save();rAi();uAiS();ren();toast('Đã xóa','ok')})}
function aiF(n){aAi=n;rAi();ren();closeSbM()}
function uAiS(){$('pAi').innerHTML='<option value="">—</option>'+AI.map(function(a){return'<option value="'+esc(a)+'">'+esc(a)+'</option>'}).join('')}

// Sections
function secMo(){if(aCat==='all')return;var c=fC(aCat);if(!c)return;$('mSecT').textContent='Ngăn — '+c.name;rSecL();op('mSec')}
function rSecL(){var c=fC(aCat);if(!c)return;$('secL').innerHTML=c.sections.map(function(s,i){return'<div class="sec-item"><span class="sec-nm">'+esc(s)+'</span><button class="sec-del" onclick="Z.secDel('+i+')">xóa</button></div>'}).join('')||'<div style="font-size:.78rem;color:var(--tx3);padding:4px">Chưa có</div>'}
function secAdd(){var c=fC(aCat);if(!c)return;var v=($('secIn').value||'').trim();if(!v)return toast('Nhập tên','err');if(c.sections.some(function(s){return s.toLowerCase()===v.toLowerCase()}))return toast('Đã tồn tại','err');c.sections.push(v);$('secIn').value='';save();rSecL();uSF();ren()}
function secDel(i){var c=fC(aCat);if(!c)return;var n=c.sections[i];P.forEach(function(p){if(p.category===aCat&&p.section===n)p.section=''});c.sections.splice(i,1);save();rSecL();uSF();ren()}
function uSF(){var s=$('secF'),b=$('secBtn');if(aCat==='all'||!(fC(aCat)||{}).sections||!fC(aCat).sections.length){s.style.display=b.style.display='none';return}b.style.display=s.style.display='';s.innerHTML='<option value="all">Tất cả ngăn</option>'+fC(aCat).sections.map(function(x){return'<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')+'<option value="__none__">Chưa phân</option>'}

// Categories
function rCats(){var co={};P.forEach(function(p){co[p.category]=(co[p.category]||0)+1});var h='<div class="cat-i'+(aCat==='all'?' on':'')+'" onclick="Z.selCat(\'all\')"><div class="cat-d" style="background:#555"></div><div class="cat-n">Tất cả</div><div class="cat-c">'+P.length+'</div></div>';C.forEach(function(c){h+='<div class="cat-i'+(aCat===c.id?' on':'')+'" data-cid="'+c.id+'"><span class="cat-grip">⠿</span><div class="cat-d" style="background:'+c.color+'"></div><div class="cat-n" onclick="Z.selCat(\''+c.id+'\')">'+esc(c.name)+'</div><div class="cat-c">'+(co[c.id]||0)+'</div><div class="cat-a"><button class="cat-ab" onclick="event.stopPropagation();Z.eCat(\''+c.id+'\')">sửa</button><button class="cat-ab" onclick="event.stopPropagation();Z.dCat(\''+c.id+'\')">xóa</button></div></div>'});$('catL').innerHTML=h;bDrag();rSt();uTF()}
function uTF(){var e=$('trC');e.textContent=TR.length||'';e.classList.toggle('h',!TR.length)}
function rSt(){var p=0,h=0,b=0;P.forEach(function(x){x.device==='pc'?p++:x.device==='phone'?h++:b++});$('sts').innerHTML='Tổng '+P.length+' · PC '+p+' · Phone '+h+' · Cả hai '+b}
function selCat(id){if(aCat!==id)pushH(id);aCat=id;rAll()}
function rAll(){rCats();uSF();ren();uTb();closeSbM()}
function devF(d){aDev=d;document.querySelectorAll('.seg-b').forEach(function(b){b.classList.toggle('on',b.dataset.d===d)});ren()}
function doSch(){sQ=($('sIn').value||'').trim().toLowerCase();ren()}
function uTb(){$('tbCat').textContent=aCat==='all'?'Tất cả':(fC(aCat)||{}).name||'Tất cả'}
function uCS(){$('pCat').innerHTML=C.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')}

// Drag
function bDrag(){document.querySelectorAll('.cat-i[data-cid]').forEach(function(el){var g=el.querySelector('.cat-grip');if(!g)return;g.onmousedown=function(e){e.preventDefault();e.stopPropagation();var did=el.dataset.cid;el.classList.add('dragging');document.onmousemove=function(ev){clDHL();var t=dTgt(ev.clientX,ev.clientY);if(t&&t.id!==did){var r=t.el.getBoundingClientRect();t.el.classList.add(ev.clientY<r.top+r.height/2?'drag-over':'drag-below')}};document.onmouseup=function(ev){document.onmousemove=document.onmouseup=null;var t=dTgt(ev.clientX,ev.clientY);if(t&&t.id!==did){var r=t.el.getBoundingClientRect();mvCat(did,t.id,ev.clientY>=r.top+r.height/2)}clDHL()}}})}
function clDHL(){document.querySelectorAll('.cat-i[data-cid]').forEach(function(e){e.classList.remove('drag-over','drag-below','dragging')})}
function dTgt(x,y){var r=null;document.querySelectorAll('.cat-i[data-cid]').forEach(function(el){var b=el.getBoundingClientRect();if(y>=b.top&&y<=b.bottom)r={el:el,id:el.dataset.cid}});return r}
function mvCat(f,t,below){var fi=C.findIndex(function(c){return c.id===f});if(fi<0)return;var item=C.splice(fi,1)[0];var ti=C.findIndex(function(c){return c.id===t});if(ti<0)ti=C.length;if(below)ti++;C.splice(ti,0,item);save();rCats();uCS()}

// Filter + Render
function getF(){return P.filter(function(p){if(aCat!=='all'&&p.category!==aCat)return false;if(aDev!=='all'&&p.device!==aDev&&p.device!=='both')return false;if(aAi!=='all'&&(p.ai||'')!==aAi)return false;var sf=$('secF');if(sf&&sf.style.display!=='none'){var sv=sf.value;if(sv&&sv!=='all'){if(sv==='__none__'){if(p.section)return false}else if((p.section||'')!==sv)return false}}if(sQ&&(p.name||'').toLowerCase().indexOf(sQ)<0&&(p.content||'').toLowerCase().indexOf(sQ)<0&&(p.note||'').toLowerCase().indexOf(sQ)<0&&(p.ai||'').toLowerCase().indexOf(sQ)<0)return false;return true}).sort(function(a,b){var s=$('tbSort').value;return s==='oldest'?(a.created||0)-(b.created||0):s==='az'?(a.name||'').localeCompare(b.name||'','vi'):s==='za'?(b.name||'').localeCompare(a.name||'','vi'):(b.created||0)-(a.created||0)})}
function ren(){var g=$('grid'),list=getF();$('tbCnt').textContent=list.length+' prompt';if(!list.length)return g.innerHTML='<div class="empty"><div class="empty-tx">'+(sQ?'Không tìm thấy':'Chưa có prompt')+'</div><div class="empty-sub">'+(sQ?'Thử từ khóa khác':'Bấm + Thêm prompt')+'</div></div>';var sf=$('secF'),grp=aCat!=='all'&&sf&&sf.style.display!=='none'&&sf.value==='all';grp?rGrp(list):g.innerHTML=list.map(bCard).join('')}
function rGrp(list){var c=fC(aCat);if(!c)return $('grid').innerHTML=list.map(bCard).join('');var gr={},ns=[];list.forEach(function(p){var s=p.section||'';s&&c.sections.indexOf(s)>-1?(gr[s]=gr[s]||[]).push(p):ns.push(p)});var h='';c.sections.forEach(function(sn){if(!gr[sn]||!gr[sn].length)return;h+='<div class="section-div"><span class="section-name">'+esc(sn)+'</span><span class="section-line"></span></div>';gr[sn].forEach(function(p){h+=bCard(p)})});if(ns.length){if(h)h+='<div class="section-div"><span class="section-name">Chưa phân ngăn</span><span class="section-line"></span></div>';ns.forEach(function(p){h+=bCard(p)})}$('grid').innerHTML=h}
function bCard(p){var c=fC(p.category),cn=c?c.name:'—',cc=c?c.color:'#555';var dv=p.device==='pc'?'<span class="tag tag-pc">PC</span>':p.device==='phone'?'<span class="tag tag-ph">PHONE</span>':'<span class="tag tag-bt">ALL</span>';var ai=p.ai?'<span class="tag tag-ai">'+esc(p.ai)+'</span>':'';var sec=p.section?'<span class="tag tag-sec">'+esc(p.section)+'</span>':'';return'<div class="card"><div class="card-h"><div class="card-t">'+esc(p.name)+'</div><div class="tags">'+sec+ai+dv+'</div></div><div class="card-p">'+esc(p.content)+'</div><div class="card-m"><span class="card-tag" style="border-left:2px solid '+cc+';padding-left:6px">'+esc(cn)+'</span><span class="card-dt">'+fmt(p.created)+'</span></div><div class="card-act"><button class="btn btn-s" onclick="event.stopPropagation();Z.view(\''+p.id+'\')">Xem</button><button class="btn btn-s" onclick="event.stopPropagation();Z.cp(\''+p.id+'\')">Chép</button><button class="btn btn-s" onclick="event.stopPropagation();Z.eMeta(\''+p.id+'\')">Sửa</button><button class="btn btn-s btn-d" onclick="event.stopPropagation();Z.del(\''+p.id+'\')">Xóa</button></div></div>'}

// Variables
function exV(c){if(!c)return[];var r=/\{\{([^}]+)\}\}/g,m,v=[],s={};while((m=r.exec(c))!==null){var k=m[1].trim();if(k&&!s[k]){s[k]=1;v.push(k)}}return v}
function fillC(c,vl){return c.replace(/\{\{([^}]+)\}\}/g,function(m,k){var v=k.trim();return vl[v]!=null&&vl[v]!==''?vl[v]:m})}
function hlF(c,vl){return esc(c).replace(/\{\{([^}]+)\}\}/g,function(m,k){var v=k.trim();return vl[v]!=null&&vl[v]!==''?'<mark>'+esc(vl[v])+'</mark>':m})}
function getVals(){var vl={};document.querySelectorAll('#wsFi .ws-fin').forEach(function(i){vl[i.dataset.v]=i.value});return vl}

// === WORKSPACE ===
function view(id){
    var p=fP(id);if(!p)return;_wi=id;_we=false;
    var c=fC(p.category);$('wsT').textContent=p.name;
    var dv=p.device==='pc'?'PC':p.device==='phone'?'Phone':'Cả hai';
    $('wsMeta').innerHTML='<span class="card-tag" style="border-left:2px solid '+(c?c.color:'#555')+';padding-left:6px">'+esc(c?c.name:'—')+'</span>'+(p.section?'<span class="tag tag-sec">'+esc(p.section)+'</span>':'')+(p.ai?'<span class="tag tag-ai">'+esc(p.ai)+'</span>':'')+'<span class="tag tag-pc">'+dv+'</span><span class="card-dt">'+fmt(p.created)+'</span>';
    wsView(p);
    p.note?($('wsNt').textContent=p.note,$('wsNW').style.display=''):$('wsNW').style.display='none';
    $('wsSc').value='';
    var vars=exV(p.content);
    $('wsCp').textContent=vars.length?'Chép kết quả':'Sao chép';
    $('wsCp').onclick=vars.length?function(){doCopy(fillC(fP(_wi).content,getVals()))}:function(){doCopy(p.content)};
    if(vars.length){$('wsRT').textContent='Điền thông tin ('+vars.length+' biến)';$('wsFi').innerHTML=vars.map(function(v){return'<div class="ws-fd"><label class="ws-fl">'+esc(v)+'</label><input class="ws-fin" data-v="'+esc(v)+'" placeholder="'+esc(v)+'..." oninput="Z.wsUp()"></div>'}).join('')}
    else{$('wsRT').textContent='Ghi chú tạm';$('wsFi').innerHTML=''}
    $('wsToggle').textContent='Sửa nội dung';$('wsMt').textContent='xem';$('wsMt').className='ws-mt ws-mv';
    op('mWs');if(vars.length){var f=$('wsFi').querySelector('.ws-fin');if(f)setTimeout(function(){f.focus()},150)}
}
function wsView(p){$('wsCW').innerHTML='<div class="ws-va" id="wsVA">'+esc(p.content)+'</div>'}
function wsEdit(p){$('wsCW').innerHTML='<textarea class="ws-ea" id="wsEA">'+esc(p.content)+'</textarea>';setTimeout(function(){var a=$('wsEA');if(a)a.focus()},50)}
function wsToggle(){
    var p=fP(_wi);if(!p)return;
    if(_we){var a=$('wsEA');if(!a)return;var v=(a.value||'').trim();if(!v)return toast('Nội dung trống','err');p.content=v;p.updated=Date.now();save();_we=false;wsView(p);$('wsToggle').textContent='Sửa nội dung';$('wsMt').textContent='xem';$('wsMt').className='ws-mt ws-mv';var vars=exV(p.content);$('wsCp').textContent=vars.length?'Chép kết quả':'Sao chép';$('wsCp').onclick=vars.length?function(){doCopy(fillC(fP(_wi).content,getVals()))}:function(){doCopy(p.content)};if(vars.length){$('wsRT').textContent='Điền ('+vars.length+' biến)';$('wsFi').innerHTML=vars.map(function(v){return'<div class="ws-fd"><label class="ws-fl">'+esc(v)+'</label><input class="ws-fin" data-v="'+esc(v)+'" placeholder="'+esc(v)+'..." oninput="Z.wsUp()"></div>'}).join('')}else{$('wsRT').textContent='Ghi chú tạm';$('wsFi').innerHTML=''}rCats();ren();toast('Đã lưu','ok')
    }else{_we=true;wsEdit(p);$('wsToggle').textContent='Lưu nội dung';$('wsMt').textContent='đang sửa';$('wsMt').className='ws-mt ws-me'}
}
function wsCl(){if(_we){var p=fP(_wi),a=$('wsEA');if(p&&a){var v=(a.value||'').trim();if(v&&v!==p.content){p.content=v;p.updated=Date.now();save();rCats();ren();toast('Tự động lưu','ok')}}_we=false}cl('mWs')}
function wsUp(){var p=fP(_wi);if(!p||_we)return;var va=$('wsVA');if(va)va.innerHTML=hlF(p.content,getVals())}

function doCopy(t){if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(function(){toast('Đã sao chép','ok')}).catch(function(){fbCp(t)});else fbCp(t)}
function fbCp(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');toast('Đã sao chép','ok')}catch(e){toast('Lỗi','err')}a.remove()}

// Cat CRUD
function addCat(){$('mCtT').textContent='Thêm danh mục';$('eCId').value='';$('cNm').value='';$('cCl').value='#635bff';$('cHx').value='#635bff';$('cPv').style.background='#635bff';op('mCt');setTimeout(function(){$('cNm').focus()},100)}
function eCat(id){var c=fC(id);if(!c)return;$('mCtT').textContent='Sửa danh mục';$('eCId').value=id;$('cNm').value=c.name;$('cCl').value=c.color;$('cHx').value=c.color;$('cPv').style.background=c.color;op('mCt');setTimeout(function(){$('cNm').focus()},100)}
function saveCat(){var e=($('eCId').value||'').trim(),n=($('cNm').value||'').trim(),co=$('cCl').value;if(!n)return toast('Nhập tên','err');if(C.some(function(c){return c.name.toLowerCase()===n.toLowerCase()&&c.id!==e}))return toast('Đã tồn tại','err');if(e){var c=fC(e);if(c){c.name=n;c.color=co}}else C.push({id:uid(),name:n,color:co,sections:[]});save();rCats();uCS();uTb();cl('mCt');toast(e?'Đã cập nhật':'Đã thêm','ok')}
function dCat(id){var c=fC(id);if(!c)return;var cnt=P.filter(function(p){return p.category===id}).length;cf('Xóa "'+trn(c.name,25)+'"?',cnt?cnt+' prompt chuyển danh mục khác.':'Không hoàn tác.','Xóa',function(){if(cnt){var fb=C.find(function(x){return x.id!==id});if(!fb){fb={id:uid(),name:'Khác',color:'#06b6d4',sections:[]};C.push(fb)}P.forEach(function(p){if(p.category===id){p.category=fb.id;p.section=''}})}C=C.filter(function(x){return x.id!==id});if(aCat===id)aCat='all';save();rAll();uCS();toast('Đã xóa','ok')})}
function cPv(){$('cPv').style.background=$('cCl').value;$('cHx').value=$('cCl').value}
function cSync(h){if(/^#[0-9a-fA-F]{6}$/.test((h||'').trim())){$('cCl').value=h;$('cPv').style.background=h}}

// Prompt CRUD
function addPr(){$('mPrT').textContent='Thêm prompt';$('eId').value='';$('pNm').value='';$('pCt').value='';$('pDev').value='both';$('pNt').value='';$('pCW').style.display='';uCS();uAiS();$('pAi').value='';if(aCat!=='all')$('pCat').value=aCat;if(aAi!=='all')$('pAi').value=aAi;op('mPr');setTimeout(function(){$('pNm').focus()},100)}
function eMeta(id){var p=fP(id);if(!p)return;$('mPrT').textContent='Sửa thông tin';$('eId').value=id;$('pNm').value=p.name;$('pDev').value=p.device||'both';$('pNt').value=p.note||'';$('pCW').style.display='none';uCS();uAiS();$('pCat').value=p.category;$('pAi').value=p.ai||'';cl('mWs');op('mPr');setTimeout(function(){$('pNm').focus()},100)}
function savePr(){var e=($('eId').value||'').trim(),n=($('pNm').value||'').trim(),cat=$('pCat').value,dv=$('pDev').value,ai=$('pAi').value||'',ct=($('pCt').value||'').trim(),nt=($('pNt').value||'').trim();if(!n)return toast('Nhập tên','err');if(!cat||!fC(cat))return toast('Chọn danh mục','err');if(e){var p=fP(e);if(!p)return toast('Không thấy','err');p.name=n;p.category=cat;p.device=dv;p.ai=ai;p.note=nt;p.updated=Date.now()}else{if(!ct)return toast('Nhập nội dung','err');P.push({id:uid(),name:n,category:cat,device:dv,ai:ai,section:'',content:ct,note:nt,created:Date.now(),updated:Date.now()})}save();rCats();ren();cl('mPr');toast(e?'Đã cập nhật':'Đã thêm','ok')}

// === TRASH ===
function del(id){var i=P.findIndex(function(p){return p.id===id});if(i<0)return;var item=P.splice(i,1)[0];item.deletedAt=Date.now();TR.push(item);save();rCats();ren();uTF();cl('mWs');toast('Vào thùng rác','ok')}
function trMo(){rTrL();op('mTr')}
function rTrL(){$('trClr').style.display=TR.length?'':'none';if(!TR.length)return $('trB').innerHTML='<div class="empty" style="min-height:80px"><div class="empty-tx">Thùng rác trống</div></div>';$('trB').innerHTML=TR.slice().reverse().map(function(p){var c=fC(p.category);return'<div class="tr-item"><div class="tr-info"><div class="tr-name">'+esc(p.name)+'</div><div class="tr-meta">'+esc(c?c.name:'—')+' · '+fmt(p.deletedAt)+'</div></div><button class="btn btn-s btn-w" onclick="Z.trRes(\''+p.id+'\')">Khôi phục</button><button class="btn btn-s btn-d" onclick="Z.trDel(\''+p.id+'\')">Xóa hẳn</button></div>'}).join('')}
function trRes(id){var i=TR.findIndex(function(p){return p.id===id});if(i<0)return;var it=TR.splice(i,1)[0];delete it.deletedAt;if(!fC(it.category)){it.category=C.length?C[0].id:(function(){var fid=uid();C.push({id:fid,name:'Khôi phục',color:'#06b6d4',sections:[]});return fid})()}P.push(it);save();rCats();ren();rTrL();uTF();toast('Đã khôi phục','ok')}
function trDel(id){cf('Xóa vĩnh viễn?','Không thể khôi phục.','Xóa vĩnh viễn',function(){TR=TR.filter(function(x){return x.id!==id});save();rTrL();uTF();toast('Đã xóa vĩnh viễn','ok')})}
function trClr(){if(!TR.length)return;cf('Dọn sạch thùng rác?',TR.length+' mục sẽ mất vĩnh viễn.','Dọn sạch',function(){TR=[];save();rTrL();uTF();toast('Đã dọn sạch','ok')})}

// Keyboard
document.addEventListener('keydown',function(e){if(e.target.tagName==='TEXTAREA'&&e.key==='Tab'){e.preventDefault();var t=e.target,s=t.selectionStart,en=t.selectionEnd;t.value=t.value.substring(0,s)+'  '+t.value.substring(en);t.selectionStart=t.selectionEnd=s+2}if((e.ctrlKey||e.metaKey)&&e.key==='s'){if($('mPr').classList.contains('show')){e.preventDefault();savePr()}else if($('mWs').classList.contains('show')&&_we){e.preventDefault();wsToggle()}}});

load();rCats();rAi();uSF();ren();uTb();uCS();uAiS();uTF();history.replaceState(null,'');

window.Z={toggleSb:toggleSb,selCat:selCat,devF:devF,aiF:aiF,aiAdd:aiAdd,aiDel:aiDel,sch:function(){clearTimeout(_st);_st=setTimeout(doSch,200)},ren:ren,addPr:addPr,addCat:addCat,eCat:eCat,dCat:dCat,saveCat:saveCat,savePr:savePr,eMeta:eMeta,view:view,cp:function(id){var p=fP(id);if(p)doCopy(p.content)},del:del,trRes:trRes,trDel:trDel,trClr:trClr,trMo:trMo,op:op,cl:cl,cPv:cPv,cSync:cSync,secMo:secMo,secAdd:secAdd,secDel:secDel,wsUp:wsUp,wsToggle:wsToggle,wsCl:wsCl,cfYes:cfYes,cfNo:cfNo}
}();
</script>
